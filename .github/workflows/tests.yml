name: Tests 2N Color
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer dépendances
        run: pip install -r requirements-dev.txt
      - name: Compiler le Python
        run: python -m compileall -q app mac_agent.py tests
      - name: Exécuter les tests
        run: pytest -q
      - name: Vérifier JavaScript Safari/Firefox
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("app/static/index.html").read_text(encoding="utf-8")
          js = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/2n-color-ui.js").write_text(js, encoding="utf-8")
          PY
          node --check /tmp/2n-color-ui.js
      - name: Valider Docker Compose
        run: |
          MEDIA_ROOT=/tmp PORT=8765 AGENT_TOKEN=test123 docker compose config --quiet
